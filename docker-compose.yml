version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: all-market-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: allmarket
      POSTGRES_PASSWORD: allmarket123
      POSTGRES_DB: all_market_ethiopia
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U allmarket -d all_market_ethiopia']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
